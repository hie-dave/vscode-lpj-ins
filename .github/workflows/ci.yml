name: CI/CD

on:
  push:
    branches: [ master ]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch: {}

# Required for trusted publishing (OIDC) to the Visual Studio Marketplace
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npx @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-lpj-ins
          path: "lpj-ins-file-*.vsix"
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vscode-lpj-ins
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      # Verify that the pushed tag matches the version in package.json
      - name: Verify version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc --packagePath lpj-ins-file-*.vsix
